# Re-usable workflow to deploy a previously built image.
name: deploy-to-ecs
permissions:
  id-token: write
  contents: read

on:
  workflow_call:
    inputs:
      role-to-assume:
        required: true
        type: string
      region:
        required: true
        type: string      
      registry:
        required: true
        type: string
      repo-name:
        required: true
        type: string
      wait-for-replication:
        required: false
        type: boolean
        default: false
      source-region:
        required: false
        type: string
        description: "region of the source ECR repository to check replication status against; defaults to 'region' if blank."
      cluster-name:
        required: true
        type: string
      task-family:
        required: true
        type: string
      service-name:
        required: false
        type: string
        description: "service name to deploy to; if present will wait for stability; leave blank to only push the taskdef."
      parameter-prefix:
        required: false
        type: string
        description: "prefix of SSM parameter to update; if blank task-family will be used."
      put-version:
        required: false
        type: boolean
        description: "whether to store the new version into SSM"
        default: true
      deployed-to-env:
        required: false
        type: string
        description: "if set (blank by default) will add a tag of the form name of 'ENV.deployed.TS to the ECR image after deployment."

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.role-to-assume }}
        aws-region: ${{ inputs.region }}

    - name: wait for ECR replication
      if: ${{ inputs.wait-for-replication }}
      env:
        REPOSITORY_NAME: ${{ inputs.repo-name }}
        IMAGE_TAG: ${{ github.sha }}
        REGISTRY_ID: ${{ inputs.registry }}
        # we deploy from the destination region's copy, so we only care that
        # replication into this region (DEST_REGION) has completed.
        DEST_REGION: ${{ inputs.region }}
        # replication status must be queried against the *source* repository's region,
        # which may differ from the deployment region; defaults to the deploy region.
        SOURCE_REGION: ${{ inputs.source-region != '' && inputs.source-region || inputs.region }}
      run: |
        set -euo pipefail
        timeout=300        # max seconds to wait
        interval=3         # seconds between polls
        elapsed=0

        while true; do
          # filter to the replication destination matching the region we deploy to
          statuses=$(aws ecr describe-image-replication-status \
            --repository-name "$REPOSITORY_NAME" \
            --image-id imageTag="$IMAGE_TAG" \
            --region "$SOURCE_REGION" \
            ${REGISTRY_ID:+--registry-id "$REGISTRY_ID"} \
            --query "replicationStatuses[?region=='${DEST_REGION}'].status" \
            --output text)

          echo "Replication status for ${DEST_REGION}: ${statuses:-<none yet>}"

          if echo "$statuses" | grep -qw FAILED; then
            echo "::error::ECR replication to ${DEST_REGION} failed"
            exit 1
          fi

          # destination for DEST_REGION exists and is no longer in progress
          if [ -n "$statuses" ] && ! echo "$statuses" | grep -qw IN_PROGRESS; then
            echo "Replication to ${DEST_REGION} complete."
            break
          fi

          if [ "$elapsed" -ge "$timeout" ]; then
            echo "::error::Timed out after ${timeout}s waiting for replication to ${DEST_REGION}"
            exit 1
          fi
          sleep "$interval"
          elapsed=$((elapsed + interval))
        done

    - name: fetch current task definition
      run: |
        aws ecs describe-task-definition --task-definition ${{ inputs.task-family }}-template --query taskDefinition > template.json

    - name: render updated definition
      id: render
      run: |
        repo="${{ inputs.registry }}.dkr.ecr.${{ inputs.region }}.amazonaws.com/${{ inputs.repo-name }}"
        cat template.json | \
        jq --arg repo "$repo" --arg sha "${{ github.sha }}" \
          '.containerDefinitions |= map(if (.image | startswith($repo + ":")) then .image = $repo + ":" + $sha else . end)' | \
        jq 'setpath(["family"]; "${{ inputs.task-family }}") | delpaths([["taskDefinitionArn"],["registeredAt"],["registeredBy"]])' \
        > task-definition.json
        cat task-definition.json
        echo "task-definition=task-definition.json" >> "$GITHUB_OUTPUT"

    - name: deploy to ECS cluster - ${{ inputs.cluster-name }}
      uses: aws-actions/amazon-ecs-deploy-task-definition@v2
      with:
        task-definition: ${{ steps.render.outputs.task-definition }}
        cluster: ${{ inputs.cluster-name }}
        service: ${{ inputs.service-name }}
        wait-for-service-stability: ${{ inputs.service-name != '' }}

    - name: store updated image version in SSM
      if: ${{ inputs.put-version }}
      run: |
        aws ssm put-parameter --name /${{ inputs.parameter-prefix != '' && inputs.parameter-prefix || inputs.task-family }}/image_tag --type String --value ${{ github.sha }} --overwrite

    # TODO: make this work with cross-account registries (role assumption!)
    - name: add deployment tag to image in ECR as a docker tag
      if: ${{ inputs.deployed-to-env != '' }}
      run: |
        MANIFEST=$(aws ecr batch-get-image --repository-name ${{ inputs.repo-name }} --image-ids imageTag=${{ github.sha }} --output text --query 'images[].imageManifest')
        aws ecr put-image --repository-name ${{ inputs.repo-name }} --image-tag "${{ inputs.deployed-to-env }}.deployed.$(date +%Y%m%d.%H%M)" --image-manifest "$MANIFEST"

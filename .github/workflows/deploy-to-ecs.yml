# Re-usable workflow to deploy a previously built image.
name: deploy-to-ecs
permissions:
  id-token: write
  contents: read

on:
  workflow_call:
    inputs:
      role-to-assume:
        required: true
        type: string
      region:
        required: true
        type: string      
      registry:
        required: true
        type: string
      repo-name:
        required: true
        type: string
      wait-for-replication:
        required: false
        type: boolean
        default: false
      source-region:
        required: false
        type: string
        description: "region of the source ECR repository to check replication status against; defaults to 'region' if blank."
      cluster-name:
        required: true
        type: string
      task-family:
        required: false
        type: string
        description: "[deprecated] single task family to deploy; use this together with service-name, or use task-families for multiple."
      task-families:
        required: false
        type: string
        description: "multiple families to deploy, one 'family[:service]' entry per line (or comma separated). When set, fetch/render/deploy run for each entry and service-name is ignored. A service, when present, is waited on for stability."
      service-name:
        required: false
        type: string
        description: "[deprecated] service name to deploy to (single-family mode); if present will wait for stability; leave blank to only push the taskdef."
      parameter-prefix:
        required: false
        type: string
        description: "prefix of SSM parameter to update; if blank task-family will be used."
      put-version:
        required: false
        type: boolean
        description: "whether to store the new version into SSM"
        default: true
      deployed-to-env:
        required: false
        type: string
        description: "if set (blank by default) will add a tag of the form name of 'ENV.deployed.TS to the ECR image after deployment."

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.role-to-assume }}
        aws-region: ${{ inputs.region }}

    - name: wait for ECR replication
      if: ${{ inputs.wait-for-replication }}
      env:
        REPOSITORY_NAME: ${{ inputs.repo-name }}
        IMAGE_TAG: ${{ github.sha }}
        REGISTRY_ID: ${{ inputs.registry }}
        # we deploy from the destination region's copy, so we only care that
        # replication into this region (DEST_REGION) has completed.
        DEST_REGION: ${{ inputs.region }}
        # replication status must be queried against the *source* repository's region,
        # which may differ from the deployment region; defaults to the deploy region.
        SOURCE_REGION: ${{ inputs.source-region != '' && inputs.source-region || inputs.region }}
      run: |
        set -euo pipefail
        timeout=300        # max seconds to wait
        interval=3         # seconds between polls
        elapsed=0

        while true; do
          # filter to the replication destination matching the region we deploy to
          statuses=$(aws ecr describe-image-replication-status \
            --repository-name "$REPOSITORY_NAME" \
            --image-id imageTag="$IMAGE_TAG" \
            --region "$SOURCE_REGION" \
            ${REGISTRY_ID:+--registry-id "$REGISTRY_ID"} \
            --query "replicationStatuses[?region=='${DEST_REGION}'].status" \
            --output text)

          echo "Replication status for ${DEST_REGION}: ${statuses:-<none yet>}"

          if echo "$statuses" | grep -qw FAILED; then
            echo "::error::ECR replication to ${DEST_REGION} failed"
            exit 1
          fi

          # destination for DEST_REGION exists and is no longer in progress
          if [ -n "$statuses" ] && ! echo "$statuses" | grep -qw IN_PROGRESS; then
            echo "Replication to ${DEST_REGION} complete."
            break
          fi

          if [ "$elapsed" -ge "$timeout" ]; then
            echo "::error::Timed out after ${timeout}s waiting for replication to ${DEST_REGION}"
            exit 1
          fi
          sleep "$interval"
          elapsed=$((elapsed + interval))
        done

    - name: resolve task families
      id: families
      env:
        TASK_FAMILY: ${{ inputs.task-family }}
        SERVICE_NAME: ${{ inputs.service-name }}
        TASK_FAMILIES: ${{ inputs.task-families }}
      run: |
        set -euo pipefail
        if [ -n "${TASK_FAMILIES}" ]; then
          # accept newline and/or comma separated 'family[:service]' entries
          list=$(printf '%s\n' "${TASK_FAMILIES}" | tr ',' '\n' \
            | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -v '^$' || true)
        elif [ -n "${TASK_FAMILY}" ]; then
          if [ -n "${SERVICE_NAME}" ]; then
            list="${TASK_FAMILY}:${SERVICE_NAME}"
          else
            list="${TASK_FAMILY}"
          fi
        else
          echo "::error::either task-family or task-families must be provided"
          exit 1
        fi

        if [ -z "${list}" ]; then
          echo "::error::no task families resolved from inputs"
          exit 1
        fi

        # primary family (first entry, family part only) used for SSM defaulting
        primary=$(printf '%s\n' "${list}" | head -n1 | cut -d: -f1)

        {
          echo "list<<EOF"
          printf '%s\n' "${list}"
          echo "EOF"
          echo "primary=${primary}"
        } >> "$GITHUB_OUTPUT"

    - name: fetch, render & deploy task definitions
      env:
        REGISTRY: ${{ inputs.registry }}
        REGION: ${{ inputs.region }}
        REPO_NAME: ${{ inputs.repo-name }}
        CLUSTER: ${{ inputs.cluster-name }}
        IMAGE_TAG: ${{ github.sha }}
        FAMILIES: ${{ steps.families.outputs.list }}
      run: |
        set -euo pipefail
        repo="${REGISTRY}.dkr.ecr.${REGION}.amazonaws.com/${REPO_NAME}"

        while IFS= read -r entry; do
          [ -n "$entry" ] || continue
          family="${entry%%:*}"
          if [ "$entry" = "$family" ]; then
            service=""
          else
            service="${entry#*:}"
          fi
          echo "::group::deploy ${family}${service:+ (service: ${service})}"

          # fetch current task definition template
          aws ecs describe-task-definition --task-definition "${family}-template" \
            --query taskDefinition > template.json

          # render: point the matching container image at the new sha, set the
          # family, and strip read-only fields that register-task-definition rejects
          jq --arg repo "$repo" --arg sha "$IMAGE_TAG" \
            '.containerDefinitions |= map(if (.image | startswith($repo + ":")) then .image = $repo + ":" + $sha else . end)' template.json \
          | jq --arg family "$family" \
            'setpath(["family"]; $family)
             | delpaths([["taskDefinitionArn"],["registeredAt"],["registeredBy"],["status"],["revision"],["requiresAttributes"],["compatibilities"]])' \
            > task-definition.json
          cat task-definition.json

          # register the new revision
          task_arn=$(aws ecs register-task-definition \
            --cli-input-json file://task-definition.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "registered ${task_arn}"

          # deploy to the service and wait for stability, only when a service is given
          if [ -n "$service" ]; then
            aws ecs update-service --cluster "$CLUSTER" --service "$service" \
              --task-definition "$task_arn" >/dev/null
            echo "waiting for service ${service} to stabilize..."
            aws ecs wait services-stable --cluster "$CLUSTER" --services "$service"
          fi

          echo "::endgroup::"
        done <<< "$FAMILIES"

    - name: store updated image version in SSM
      if: ${{ inputs.put-version }}
      run: |
        aws ssm put-parameter --name /${{ inputs.parameter-prefix != '' && inputs.parameter-prefix || steps.families.outputs.primary }}/image_tag --type String --value ${{ github.sha }} --overwrite

    # TODO: make this work with cross-account registries (role assumption!)
    - name: add deployment tag to image in ECR as a docker tag
      if: ${{ inputs.deployed-to-env != '' }}
      run: |
        MANIFEST=$(aws ecr batch-get-image --repository-name ${{ inputs.repo-name }} --image-ids imageTag=${{ github.sha }} --output text --query 'images[].imageManifest')
        aws ecr put-image --repository-name ${{ inputs.repo-name }} --image-tag "${{ inputs.deployed-to-env }}.deployed.$(date +%Y%m%d.%H%M)" --image-manifest "$MANIFEST"

name: Review Agent (shared)

# Reusable workflow that provides PR code review (including approval /
# request-changes) via Claude Code.
#
# Two modes, selected by the `mode` input:
#
#   mode: auto      - Standard pull_request-triggered review. Runs the
#                     PR-author-is-bot skip check and diff-hash dedupe.
#                     May exit early without reviewing.
#
#   mode: requested - Human-initiated re-review (typically triggered by
#                     pull_request_review_comment). Skips all dedupe,
#                     always runs, embeds github.event.comment.body as
#                     reviewer special instructions in the prompt.
#
# USAGE
#
# Standard pull_request review (in the consumer repo):
#
#   name: Review Agent
#   on:
#     pull_request:
#       types: [opened, synchronize, ready_for_review, reopened]
#   jobs:
#     review:
#       uses: mkmba-nz/github-infra/.github/workflows/review-agent.yml@v1
#       secrets: inherit
#
# Human-requested re-review on @-mention:
#
#   name: Review Agent (Re-review)
#   on:
#     pull_request_review_comment:
#       types: [created]
#   jobs:
#     rereview:
#       if: |
#         !contains(github.event.pull_request.labels.*.name, 'skip-workflows') &&
#         (contains(github.event.comment.body, '@mkmba-review-agent') ||
#          contains(github.event.comment.body, '@review-agent')) &&
#          contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
#       uses: mkmba-nz/github-infra/.github/workflows/review-agent.yml@v1
#       secrets: inherit
#       with:
#         mode: requested
#
# The author_association check restricts triggering to repo members and
# collaborators. This is essential in public repos - any logged-in user
# can comment on a public PR, and the comment body is interpolated into
# the prompt, so an outsider could otherwise inject instructions into
# the review bot.
#
# REQUIRED VARIABLES (org-level, visibility=all — available to every repo):
#
#   TS_OAUTH_CLIENT_ID, TS_AUDIENCE
#     Tailscale OIDC credentials used to reach the llmux Anthropic gateway.
#   REVIEW_AGENT_APP_ID
#     Numeric ID of the GitHub App that posts the review.
#   MKMBA_ANTHROPIC_BASE_URL
#     Address of the proxy used to reach claude.
#
# REQUIRED SECRETS (consumer repo must inherit; org secret is scoped to
# selected repos, so the caller repo must be authorised for it):
#
#   REVIEW_AGENT_PRIVATE_KEY
#     Private key for the GitHub App that posts the review.
#
# CONVENTIONS this workflow relies on:
#
#   - All other review-agent bots in the org have logins ending in "-agent"
#     (so the human-reviewer detection can exclude them with a single test).
#   - The review bot's GraphQL author.login is the App slug without "[bot]"
#     (GraphQL renders Bot actor logins this way) - so matching is done
#     against the bare slug in BOT_SLUG.

on:
  workflow_call:
    inputs:
      mode:
        description: |
          'auto' (default): pull_request-triggered review with skip/dedupe.
          'requested': human-initiated re-review, skips checks, embeds the
          triggering comment body as reviewer special instructions.
        required: false
        type: string
        default: auto
      extra-instructions:
        description: |
          Repo-specific instructions appended verbatim to the end of the
          review prompt. Use for guidance the shared prompt does not cover
          (e.g. "Pay extra attention to schema migrations - this repo runs
          them automatically on deploy.").
        required: false
        type: string
        default: ""
    secrets:
      REVIEW_AGENT_PRIVATE_KEY:
        required: true

# Shared by both modes - prevents review and re-review from racing on the
# same PR. Rapid-fire @-mentions in requested mode also cancel earlier
# re-reviews, so the latest reviewer instructions win.
concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest    
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Full history needed for diff against base
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Compute diff hash
        id: diff
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }} --depth=1
          DIFF_HASH=$(git diff origin/${{ github.event.pull_request.base.ref }}...HEAD | sha256sum | cut -d' ' -f1)
          echo "diff_hash=$DIFF_HASH" >> $GITHUB_OUTPUT
          echo "::notice::Computed diff-hash:$DIFF_HASH"

      - name: Decide whether to review
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          # GraphQL author.login for Bot actors is the App slug without "[bot]"
          BOT_SLUG: "mkmba-review-agent"
          MODE: ${{ inputs.mode }}
          DIFF_HASH: ${{ steps.diff.outputs.diff_hash }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
        run: |
          if [[ "$MODE" == "requested" ]]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "is_rereview=true" >> $GITHUB_OUTPUT
            echo "::notice::mode=requested - running unconditionally"
            exit 0
          fi

          # mode=auto: skip if PR author is a bot AND a human has reviewed
          # since the last bot approval (defer to the active human).
          if [[ "$PR_AUTHOR_TYPE" == "Bot" ]]; then
            REVIEWS=$(gh pr view "$PR_NUMBER" --json reviews --jq '.reviews')
            LAST_APPROVAL_TIME=$(echo "$REVIEWS" | jq -r --arg bot "$BOT_SLUG" '
              [.[] | select(.author.login == $bot) | select(.state == "APPROVED") | .submittedAt]
              | sort | last // empty')
            if [[ -n "$LAST_APPROVAL_TIME" ]]; then
              # Any reviewer whose login does not end in "-agent" counts as human.
              HUMAN_REVIEWS_AFTER=$(echo "$REVIEWS" | jq --arg t "$LAST_APPROVAL_TIME" '
                [.[] | select(.author.login | test("-agent$") | not) | select(.submittedAt > $t)]
                | length')
              if [[ "${HUMAN_REVIEWS_AFTER:-0}" -gt 0 ]]; then
                echo "should_run=false" >> $GITHUB_OUTPUT
                echo "::notice::Skipping - human reviewer active since agent approval at $LAST_APPROVAL_TIME"
                exit 0
              fi
            fi
          fi

          # mode=auto: dedupe by diff hash against prior bot comments.
          # gh's --jq takes a filter string only - it is not jq and rejects jq
          # flags like --arg - so the filter reads BOT_SLUG from the environment.
          # Keep the fetch out of a pipeline: the default shell is `bash -e`
          # without pipefail, so `gh ... | jq ...` would swallow a gh failure and
          # silently degrade into "no prior reviews" - the defect fixed here.
          if ! BOT_COMMENTS=$(gh pr view "$PR_NUMBER" --json comments \
              --jq '.comments[] | select(.author.login == env.BOT_SLUG) | .body'); then
            echo "::error::Could not fetch comments for PR #$PR_NUMBER - unable to tell whether diff-hash:$DIFF_HASH has already been reviewed"
            exit 1
          fi
          EXACT_MATCH=$(echo "$BOT_COMMENTS" | grep "diff-hash:$DIFF_HASH" | tail -1 || true)
          PREVIOUS_HASH=$(echo "$BOT_COMMENTS" | grep -oP 'diff-hash:\K[a-f0-9]{64}' | tail -1 || true)

          if [[ -n "$EXACT_MATCH" ]]; then
            echo "should_run=false" >> $GITHUB_OUTPUT
            echo "::notice::Skipping - diff-hash:$DIFF_HASH was already reviewed"
          elif [[ -n "$PREVIOUS_HASH" ]]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "is_rereview=true" >> $GITHUB_OUTPUT
            echo "::notice::Re-review - previous was diff-hash:$PREVIOUS_HASH, now diff-hash:$DIFF_HASH"
          else
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "is_rereview=false" >> $GITHUB_OUTPUT
            echo "::notice::First review for diff-hash:$DIFF_HASH"
          fi

      - name: Tailscale
        if: steps.decide.outputs.should_run == 'true'
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:github

      - name: Generate GitHub App token
        if: steps.decide.outputs.should_run == 'true'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.REVIEW_AGENT_APP_ID }}
          private-key: ${{ secrets.REVIEW_AGENT_PRIVATE_KEY }}

      - name: Review Agent
        if: steps.decide.outputs.should_run == 'true'
        uses: anthropics/claude-code-action@v1.0.112
        env:
          ANTHROPIC_BASE_URL: ${{ vars.MKMBA_ANTHROPIC_BASE_URL }}
          ANTHROPIC_AUTH_TOKEN: "${{ github.job }}-${{ github.repository }}"
        with:
          anthropic_api_key: x   # Uses env config above
          github_token: ${{ steps.app-token.outputs.token }}
          bot_id: ${{ vars.REVIEW_AGENT_APP_ID }}
          bot_name: "mkmba-review-agent[bot]"
          allowed_bots: "*"      # Allow other agents (GitHub Apps) to trigger this

          # Enable progress tracking
          track_progress: true

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            ${{ steps.decide.outputs.is_rereview == 'true' && 'RE-REVIEW: This PR was previously reviewed. Focus ONLY on what has CHANGED since the previous review.' || '' }}
            ${{ inputs.mode == 'requested' && 'REVIEWER SPECIAL INSTRUCTIONS (from the comment that triggered this re-review, may override default instructions):' || '' }}
            ${{ inputs.mode == 'requested' && github.event.comment.body || '' }}

            ## Analysis scope

            Perform a comprehensive review. Examine the change, and the code
            around it, for problems in the areas below. This list is a checklist
            for YOUR analysis - it is NOT a template for your output. Do NOT
            structure your report around it, and do NOT mention an area you have
            nothing to report on.

            1. **Code quality** - clean code principles, error handling and edge
               cases, readability and maintainability.
            2. **Security** - vulnerabilities, input sanitisation,
               authentication and authorisation logic.
            3. **Performance** - bottlenecks, inefficient queries, memory and
               resource leaks.
            4. **Testing** - coverage of the change, test quality, missing
               scenarios and edge cases.
            5. **Documentation** - code comments where warranted, README updates
               for new features, API documentation accuracy.

            ## Output contract: report each finding EXACTLY ONCE

            You have two output channels, and every finding belongs to exactly
            one of them. Repeating the same finding in more than one place makes
            the review harder to read and is the failure mode this contract
            exists to prevent.

            **Channel 1 - inline comments**, for a specific problem at a specific
            line. Raise every such problem this way, on the line it affects:
              - Only comment when the issue requires a change, or is particularly
                severe. Do NOT use inline comments for general feedback or
                compliments.
            ${{ steps.decide.outputs.is_rereview == 'true' && '  - Do NOT repeat comments from previous reviews. Comment only on issues related to new or modified code since the last review.' || '' }}
            ${{ steps.decide.outputs.is_rereview == 'true' && '  - Mark inline comments from previous reviews that are now addressed as resolved.' || '' }}

            **Channel 2 - the summary comment**. Your final output is published
            for you as a tracking comment on the PR - that comment IS your
            summary, so do NOT create a second one with `gh pr comment`. It is
            the ONLY place for findings that are not inline comments. Keep to
            this shape:
              - One verdict line: approved, or changes requested, with a brief
                clause saying why.
              - Then bulleted points, a sentence or two each, covering only
                findings you did not raise inline. None at all is the correct
                answer when there is nothing more to say.
              - You MUST NOT restate in a bullet a finding you already raised as
                an inline comment. A pointer or a count is the most you may add
                (for example "3 inline comments"). The verdict line may name the
                reason in passing.
              - No compliments or praise, no description of what the PR does, no
                area-by-area narration, no account of how you conducted the
                review.
              - Last of all, the diff-hash marker given at the end of these
                instructions.
            ${{ steps.decide.outputs.is_rereview == 'true' && '  - Where there were earlier reviews, cover only what has changed since them, and do NOT restate their findings or approving commentary - readers have already seen those. Still give your verdict line.' || '' }}

            Reviewer special instructions, where present, take precedence over
            this shape.

            ## Submitting the review

            YOU HAVE PERMISSION AND CAPABILITY to submit GitHub PR reviews using the `gh pr review` command.
            You MUST submit a review when your analysis is complete.

            Submit a gh review with status set to reflect your overall verdict.
            The body is asymmetric - do NOT put your findings in it either way:
              - No blocking issues -> `gh pr review --approve` with NO body at
                all. Do NOT pass -b.
              - Blocking issues present -> `gh pr review --request-changes -b "<one line>"`.
                That one line states the verdict and says the detail is in the
                review summary comment. It is required only because GitHub
                rejects a request-changes review with an empty body.

            IMPORTANT: Failure to set a review status will stall the entire PR workflow in this repository!
            Do NOT claim you cannot submit reviews - you have the tool permission and GitHub token to do so.

            IMPORTANT: The dedupe logic reads the marker below from PR comments
            only, never from review bodies, so it must go in your summary
            comment. Append it verbatim as the LAST line of that comment:
            diff-hash:${{ steps.diff.outputs.diff_hash }}

            ${{ inputs.extra-instructions }}
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr review:*)"

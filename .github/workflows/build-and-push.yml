name: build-and-push
permissions:
    id-token: write
    contents: read

on:
  workflow_call:
    inputs:
      role-to-assume:
        required: true
        type: string
      region:
        required: true
        type: string
      registries:
        required: false
        type: string
      repo-name:
        required: true
        type: string
      context:
        required: true
        type: string
      file:
        required: false
        type: string
        description: "path to the Dockerfile (relative to the workspace root); defaults to <context>/Dockerfile."
      target:
        required: false
        type: string
      build-args:
        required: false
        type: string
      platforms:
        required: false
        type: string
        default: linux/amd64
      runs-on:
        required: false
        type: string
        description: |
          Runner label for the build job. Leave blank (default) to derive it from
          `platforms`: ubuntu-26.04-arm for exactly linux/arm64, so it builds natively
          rather than under QEMU emulation, and ubuntu-26.04 otherwise. Set it only to
          override that choice.
      private-modules:
        required: false
        type: boolean
        default: false
        description: |
          Mint a short-lived org-wide read-only token for the build and mount it as the
          BuildKit secret `github_token`. Nothing is minted or mounted when false.

jobs:
  build-and-push:
    # The runner is chosen here, not by the input's default: a workflow_call input
    # default cannot reference another input.
    runs-on: ${{ inputs.runs-on || (inputs.platforms == 'linux/arm64' && 'ubuntu-26.04-arm' || 'ubuntu-26.04') }}
    steps:
      # persist-credentials: false keeps the job's GITHUB_TOKEN out of the
      # workspace .git/config, which a build context that includes .git would
      # otherwise copy into a layer the cache-to below exports. Nothing after
      # this step needs the git credential. See the README section "Fetching
      # private modules".
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.role-to-assume }}
          aws-region: ${{ inputs.region }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registries: ${{ inputs.registries }}

      # Minted here, not by the caller: a called workflow runs as its own job, so
      # nothing the caller minted reaches it. @main is the self-reference
      # review-agent.yml also makes - a workflow cannot name its own ref.
      - name: Mint org read token
        if: ${{ inputs.private-modules }}
        uses: mkmba-nz/github-infra/actions/github-org-token@main

      # This job's workspace is its own fresh checkout, so anything git reports here
      # was left by a step above rather than by the caller. For a caller whose
      # context includes it, that reaches the image, where `go build -buildvcs` reads
      # it as a modified tree and stamps the binary "(modified)" - a wrong provenance
      # record that nothing else surfaces. A warning rather than a failure: the cost
      # is an inaccurate stamp, not a broken image, and this workflow is the single
      # path every image build in the org takes.
      - name: Warn if a step above dirtied the build context
        env:
          CONTEXT: ${{ inputs.context }}
        run: |
          set -euo pipefail
          # `|| exit 0` and not `|| true`: a caller whose context is outside the
          # repository has nothing to report, and reporting nothing is this step
          # succeeding. It also keeps -e from turning that case into a failed build.
          DIRT="$(git status --porcelain -- "$CONTEXT" 2>/dev/null)" || exit 0
          if [ -n "$DIRT" ]; then
            echo "::warning::${CONTEXT} is not clean, so a binary built from it with go's -buildvcs will stamp itself \"(modified)\". Paths below."
            echo "$DIRT"
          fi

      # Only reachable through an explicit runs-on, which is honoured as deliberate;
      # the warning makes the cost visible. A multi-platform build emulates at least
      # one platform on any runner, so it is not singled out.
      - name: Warn if the build is emulated
        if: ${{ (inputs.platforms == 'linux/arm64' && runner.arch == 'X64') || (inputs.platforms == 'linux/amd64' && runner.arch == 'ARM64') }}
        env:
          PLATFORMS: ${{ inputs.platforms }}
          ARCH: ${{ runner.arch }}
        run: echo "::warning::Building ${PLATFORMS} on a ${ARCH} runner runs under QEMU emulation, which is several times slower than a native build. Unless the emulation is intended, leave runs-on unset and the workflow picks a native runner."

      - name: Build, tag, and push docker image to Amazon ECR
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          target: ${{ inputs.target }}
          cache-from: type=gha,scope=${{ inputs.repo-name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.repo-name }}
          platforms: ${{ inputs.platforms }}
          # With private-modules, inject a read-only GitHub credential so private go modules can be fetched
          # during builds. Use this channel: BuildKit mounts a secret only for the RUN
          # that asks for it, so it reaches neither the layer nor its build history. See
          # the README section "Fetching private modules" for the Dockerfile side.
          secrets: ${{ inputs.private-modules && format('github_token={0}', env.MKMBA_GITHUB_TOKEN) || '' }}
          build-args: ${{ inputs.build-args }}
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ inputs.repo-name }}:${{ github.sha }}
          # SPDX SBOM for image-content tooling; the tag is already an OCI
          # index from default provenance.
          sbom: true
